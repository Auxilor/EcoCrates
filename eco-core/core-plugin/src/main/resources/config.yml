#
# EcoCrates
# by Auxilor
#

# Even if eco is set up to use a database, you can
# force EcoCrates to save to local storage to disable
# cross-server sync.
use-local-storage: false

no-key-velocity: 1.5 # The speed at which a player should be launched away from a crate if they try to open it without a key. Set to 0 to disable.
track-player-keys: false # If an NBT tag should be added to keys that links them to a player - will prevent stacking some keys.

# If a reward allows permission multipliers, the weights
# will be multiplied by highest-priority multiplier that a player
# has permission for - i.e. if a player has both vip and mvp permissions,
# than they'll have the mvp one applied as it has a higher priority.
permission-multipliers:
  - permission: ecocrates.mutliplier.vip
    multiplier: 1.5
    priority: 1
  - permission: ecocrates.mutliplier.mvp
    multiplier: 2
    priority: 2

reroll:
  rows: 3
  mask:
    items:
      - black_stained_glass_pane
      - green_stained_glass_pane
    pattern:
      - "122211111"
      - "120211011"
      - "122211111"
  title: "Accept your reward?"
  accept:
    row: 2
    column: 3
  reroll:
    row: 2
    column: 7
    item: orange_stained_glass_pane
    name: "&6Reroll"
    lore:
      - "&fNot happy with your item?"
      - "&fClick to try again for"
      - "&fa chance at something else!"
      - ""
      - "&fCost: &e%price%" # %price% shows the cost of the next reroll

keygui:
  rows: 3
  mask:
    items:
      - black_stained_glass_pane
    pattern:
      - "111111111"
      - "110101011"
      - "111111111"
  title: "Your Keys (%page%/%max_page%)" # Supports %page% and %max_page% placeholders.

  page-change-sound: # The sound played when changing pages. Remove or set enabled to false to disable.
    enabled: true
    sound: ui.button.click
    pitch: 1.0
    volume: 1.0

  forwards-arrow: # The arrow for switching to the next page.
    item: arrow name:"&fNext Page" # Shown when there is a next page
    item-inactive: gray_dye name:"&7Next Page" # Shown on the last page. Remove to hide the button instead.
    row: 2
    column: 9

  backwards-arrow: # The arrow for switching to the previous page.
    item: arrow name:"&fPrevious Page" # Shown when there is a previous page
    item-inactive: gray_dye name:"&7Previous Page" # Shown on the first page. Remove to hide the button instead.
    row: 2
    column: 1

  # Custom GUI slots; see here for a how-to: https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: [ ]

animations:
  spiral:
    spirals-per-second: 0.5
    rises-per-second: 0.25
    radius: 1.5
    height: 1
    count: 1
  double_spiral:
    spirals-per-second: 0.25
    rises-per-second: 0.125
    radius: 1.5
    height: 1
    count: 1
  circle:
    spirals-per-second: 0.5
    radius: 1.5
    height: 1
    count: 1
  twirl:
    spirals-per-second: 0.5
    ticks: 80
    small-radius: 0.2
    large-radius: 1.2
    start-height: 2
    end-height: 0.7
    count: 1
  tilted_rings:
    spirals-per-second: 0.5
    radius: 1.5
    y-offset: 1
    x-offset: 1
    count: 1

rolls:
  # hide-placed-crate hides the placed crate's hologram and preview item from the
  # player who is rolling, for the duration of the roll. Only applies when opening
  # a physically placed crate, and only to the player opening it.
  csgo:
    filler: black_stained_glass_pane name:""
    selector: lime_stained_glass_pane name:""
    bias: 0.65
    scrolls: 35
    max-delay: 25
  flash:
    duration: 80
    wait: 20
    hide-placed-crate: false
  cycle:
    duration: 80
    wait: 20
    interval: 5
    height-offset: -1.0
    hide-placed-crate: true
  encircle:
    spin-time: 100
    reveal-time: 80
    items: 12
    radius: 3
    height: 1
    spins-per-second: 0.5
    rise-velocity: 0.05
    spin-velocity: 0.4
    reveal-velocity: 0.2
    hide-placed-crate: false
  elimination:
    candidates: 7
    interval: 12
    reveal-time: 30
    filler: black_stained_glass_pane name:""
    eliminated: red_stained_glass_pane name:"&cEliminated!"
  pick:
    boxes: 3
    solo-reveal-time: 25 # How long only the picked box is shown before the others open
    reveal-time: 40 # How long everything stays on screen after the other boxes open
    auto-pick: 200
    title: "Pick a box!"
    box: chest name:"&e&lClick to pick!"
    filler: black_stained_glass_pane name:""
  match:
    to-match: 2
    min-scratches: 3
    reveal-time: 40
    auto-scratch: 100
    title: "Find a pair!"
    card: gray_stained_glass_pane name:"&e&lScratch!"
    filler: black_stained_glass_pane name:""
  hologram:
    duration: 80
    wait: 20
    interval: 5
    height: 1.5
    rolling:
      - "&8>> &f%reward% &8<<"
    winner:
      - "&a&lYou won!"
      - "&f%reward%"
    hide-placed-crate: true
  vortex:
    items: 8
    start-radius: 3.0
    end-radius: 0.4
    start-height: 0.5
    end-height: 2.5
    spins-per-second: 1.0
    duration: 120
    eject-velocity: 0.6
    reward-hold-time: 25
    timeout: 400
    hide-placed-crate: false
  roulette:
    items: 8
    radius: 2.5
    height: 1.0
    steps: 32
    bias: 0.65
    max-delay: 12
    reveal-time: 30
    timeout: 400
    hide-placed-crate: false
  strike:
    height: 2.0
    rise-time: 30
    hang-time: 15
    reveal-time: 25
    interval: 5
    hide-placed-crate: false
  delivery:
    entity: allay
    spawn-distance: 5
    spawn-height: 1.5
    speed: 0.25
    hover-height: 1.4
    hand-over-time: 25
    timeout: 400
    hide-placed-crate: false
  orbit_collapse:
    items: 8
    radius: 2.5
    height: 1.5
    rise-velocity: 0.4
    orbit-velocity: 0.4
    collapse-velocity: 0.25
    spins-per-second: 0.75
    orbit-time: 100
    reward-hold-time: 30
    timeout: 400
    hide-placed-crate: false
  sky_drop:
    launch-height: 6
    rise-velocity: 0.6
    drop-velocity: 0.5
    pause: 20
    settle: 20
    decoy-count: 8
    decoy-spread: 0.25
    timeout: 400
    hide-placed-crate: false
  quick:
    height: 1.5
    rise-velocity: 0.05
    suspend: 10
    hide-placed-crate: false
  semi_instant:
    velocity:
      randomness: 0.2
      x: 0
      y: 0.3
      z: 0
    item-lifespan: 30
    hide-placed-crate: false
  slot_machine:
    filler: black_stained_glass_pane name:""
    selector: yellow_stained_glass_pane name:""
    symbols: 18
    spin-ticks: 36
    reel-stop-delay: 8
    spin-interval: 2
    start-pitch: 0.9
    pitch-step: 0.08
    hold-ticks: 30 # How long to show the won reward after the last reel stops