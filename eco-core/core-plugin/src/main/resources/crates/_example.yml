# The ID of the crate is the name of the .yml file,
# for example mythic.yml has the ID of mythic
# You can place crates anywhere in this folder,
# including in subfolders if you want to organize your crate configs
# _example.yml is not loaded.

name: "Demo Crate" # The display name of the crate
roll: csgo # The opening style, check here: https://hub.auxilor.io/ecocrates/ecocrates/animationsandrolls
# DEPRECATED: `can-reroll: true` still works (one free reroll) but is replaced by the `rerolls:` block below.
# If `rerolls:` is present it takes priority and `can-reroll` is ignored.
rerolls:
  enabled: true # Whether players can reroll their reward
  max-rerolls: 3 # How many rerolls in a row before the player is forced to accept. Resets after accepting/being forced.
  price: # The cost of each reroll. Uses the standard price system (currencies or items).
    type: emerald # A currency (e.g. from EcoBits) or an item id
    value: "%reroll%*2" # Math expression. %reroll% is the reroll number (1-based): 1st reroll = 2, 2nd = 4, 3rd = 6
    display: "&e%value% &7Emeralds" # How the price is shown; %value% is the computed amount

key: demo_key # The ID of the key for this crate (configure in /keys/demo_key.yml)
                # Multiple crates can share the same key by using the same key ID here.
preview: # The preview GUI, when left-clicking a crate or using /crates preview
  title: "Demo Crate (%page%/%max_page%)" # The title of the preview GUI. Supports %page% and %max_page% placeholders.
  rows: 6 # The amount of rows for the gui, between 1 and 6
  # Custom GUI slots shared across all preview pages; see here for a how-to: https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
  custom-slots: [ ]
  page-change-sound: # The sound played when changing pages. Remove or set enabled to false to disable.
    enabled: true
    sound: ui.button.click
    pitch: 1.0
    volume: 1.0
  forwards-arrow: # The arrow for switching to the next page
    item: arrow name:"&fNext Page" # Shown when there is a next page
    item-inactive: gray_dye name:"&7Next Page" # Shown on the last page. Remove to hide the button instead.
    row: 6
    column: 6
  backwards-arrow: # The arrow for switching to the previous page
    item: arrow name:"&fPrevious Page" # Shown when there is a previous page
    item-inactive: gray_dye name:"&7Previous Page" # Shown on the first page. Remove to hide the button instead.
    row: 6
    column: 4
  pages: # All the pages in the preview GUI. You can add as many pages as you want.
    - page: 1
      mask: # Filler items for decoration
        items: # Add as many items as you want
          - gray_stained_glass_pane # Item 1
          - black_stained_glass_pane # Item 2
        pattern:
          - "222222222"
          - "211111112"
          - "211011112"
          - "211110112"
          - "211111112"
          - "222222222"
      # Custom GUI slots; see here for a how-to: https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
      custom-slots: [ ]
      rewards: # Where to put rewards in the GUI
        - id: diamond_sword # The reward ID
          row: 3 # The row
          column: 4 # The column
        - id: stack_of_emeralds
          row: 4
          column: 6
    - page: 2
      mask: # Filler items for decoration
        items: # Add as many items as you want
          - gray_stained_glass_pane # Item 1
          - black_stained_glass_pane # Item 2
        pattern:
          - "222222222"
          - "211111112"
          - "211110112"
          - "211011112"
          - "211111112"
          - "222222222"
      # Custom GUI slots; see here for a how-to: https://hub.auxilor.io/wiki/eco/pages#custom-gui-slots
      custom-slots: [ ]
      rewards: # Where to put rewards in the GUI
        - id: bedrock
          row: 3
          column: 6
        - id: 1000_coins
          row: 4
          column: 4


pay-to-open: # If people can pay to open if they have no keys
  enabled: false # If it should be allowed
  price: 5000 # The price to buy the crate
  type: coins # The type of currency to use

placed: # Options for physically placed crates
  shift-right-click-open-all: true # Shift right-click to instantly open the whole stack of physical keys held, skipping the roll animation
  open-all-effects-per-key: false # If true, open-effects/finish-effects trigger for every key in the stack. If false (default), they trigger once for the whole batch.
  random-reward: # The random reward hologram, shows an item
    enabled: true # If the random reward should be shown
    height: 1.5 # The height above the crate at which to show the reward
    delay: 30 # The ticks between showing a new item
    name: "&fYou could win:" # The text above the item
  particles: # The particle effects around the crate, add as many as you want
    - particle: flame # https://hub.spigotmc.org/javadocs/spigot/org/bukkit/Particle.html
      animation: spiral # spiral, double_spiral, circle, twirl, or tilted_rings
  hologram: # The text hologram, requires a hologram plugin to be installed
    height: 1.5 # The height above the crate
    ticks: 200 # The total ticks to cycle all frames
    frames:
      - tick: 0 # The starting tick to show this frame
        lines:
          - "<g:#56ab2f>&lDEMO CRATE</g:#a8e063>"
          - "&b&lLeft Click to Preview"
          - '&a&lRight click to Open'
      - tick: 100
        lines:
          - "<g:#56ab2f>&lDEMO CRATE</g:#a8e063>"
          - "&a&lLeft Click to Preview"
          - '&b&lRight click to Open'

open-effects:
  - id: send_message
    args:
      message: "Good luck!"
  - id: broadcast
    args:
      message: "%player%&f is opening the %crate%&f!"
  - id: play_sound
    args:
      sound: entity_villager_yes
      volume: 10
      pitch: 1

finish-effects:
  - id: send_message
    args:
      message: "You won %reward%&f!"
  - id: broadcast
    args:
      message: "%player%&f won %reward%&f from the %crate%&f!"
  - id: play_sound
    args:
      sound: entity_generic_explode
      volume: 10
      pitch: 1

# The rewards to give, configure in /rewards/ folder
# This is separate to the reward locations so that you could have secret rewards that don't show up in the preview GUI
rewards:
  - diamond_sword
  - stack_of_emeralds
  - bedrock
  - 1000_coins